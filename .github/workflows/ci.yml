name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to validate (manual dispatch only)
        required: false
        type: string

permissions:
  contents: read

env:
  KEELMATRIX_TELEMETRY: 'off'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify manually selected commit
        if: ${{ inputs.commit_sha != '' }}
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'commit_sha must be a full 40-character commit SHA.'
          }

          $actualSha = (git rev-parse HEAD).Trim()
          if (-not [string]::Equals($actualSha, $env:EXPECTED_SHA, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Checked out commit '$actualSha' does not match requested commit '$env:EXPECTED_SHA'."
          }

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore with repository NuGet configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & dotnet restore ./KeelMatrix.PackageSurface.sln --configfile ./NuGet.config --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the repository validation gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoLogo -NoProfile -File ./scripts/run-local-gate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Platform validation

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character candidate commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked out commit
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'commit_sha must be a full 40-character commit SHA.'
          }

          $actualSha = (git rev-parse HEAD).Trim()
          if (-not [string]::Equals($actualSha, $env:EXPECTED_SHA, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Checked out commit '$actualSha' does not match requested commit '$env:EXPECTED_SHA'."
          }

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore with repository NuGet configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & dotnet restore ./KeelMatrix.PackageSurface.sln --configfile ./NuGet.config --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the repository validation gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoLogo -NoProfile -File ./scripts/run-local-gate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

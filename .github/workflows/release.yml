name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  PACKAGE_VERSION: '0.1.0'
  KEELMATRIX_TELEMETRY: 'off'

jobs:
  validate:
    name: Validate and package
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate tag, version, and finalized changelog
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          if ($version -ne "${{ env.PACKAGE_VERSION }}") { throw 'Tag version does not match the repository package version.' }
          ./scripts/validate-release.ps1 -Version $version -RequireFinalized
      - name: Installed package and artifact gate
        shell: pwsh
        run: ./scripts/run-local-gate.ps1 -ArtifactDirectory artifacts/release
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/release/*
          if-no-files-found: error

  publish:
    name: Publish package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/release
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen
      - name: Publish package with short-lived credential
        run: dotnet nuget push artifacts/release/KeelMatrix.PackageSurface.${{ env.PACKAGE_VERSION }}.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/release
      - name: Create release after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create --repo "${{ github.repository }}" "${{ github.ref_name }}" artifacts/release/KeelMatrix.PackageSurface.${{ env.PACKAGE_VERSION }}.nupkg artifacts/release/KeelMatrix.PackageSurface.${{ env.PACKAGE_VERSION }}.snupkg --verify-tag --generate-notes --title "${{ github.ref_name }}"

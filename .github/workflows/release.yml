name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  KEELMATRIX_TELEMETRY: 'off'

jobs:
  validate:
    name: Validate and package
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_contract.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate tag, version, and finalized changelog
        id: release_contract
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG) -or -not $env:RELEASE_TAG.StartsWith('v', [StringComparison]::Ordinal)) {
              throw 'Release tag must start with v.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          & ./scripts/validate-release.ps1 -Version $version -RequireFinalized -FirstRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n", [Text.UTF8Encoding]::new($false))
      - name: Build and validate exact release artifacts
        env:
          RELEASE_VERSION: ${{ steps.release_contract.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'The release contract did not provide a version.' }
          if ($env:RELEASE_TAG -cne "v$version") { throw 'The validated release version does not match the release tag.' }
          & ./scripts/run-local-gate.ps1 -ArtifactDirectory artifacts/release -ExpectedVersion $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @(
              "KeelMatrix.PackageSurface.$version.nupkg",
              "KeelMatrix.PackageSurface.$version.snupkg"
          )
          $entries = @(Get-ChildItem -LiteralPath artifacts/release -Force)
          if (@($entries | Where-Object PSIsContainer).Count -gt 0) {
              throw 'Validated release artifact directory contains a subdirectory.'
          }
          $actual = @($entries | Select-Object -ExpandProperty Name | Sort-Object)
          if (@(Compare-Object -CaseSensitive ($expected | Sort-Object) $actual).Count -ne 0) {
              throw "Validated release artifact set is not exact: $($actual -join ', ')"
          }
      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/release/*
          if-no-files-found: error

  publish:
    name: Publish package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/release
      - name: Validate package set before NuGet authentication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'The validated release version is missing.' }
          if ($env:RELEASE_TAG -cne "v$version") { throw 'The validated release version does not match the release tag.' }
          $expected = @(
              "KeelMatrix.PackageSurface.$version.nupkg",
              "KeelMatrix.PackageSurface.$version.snupkg"
          )
          $entries = @(Get-ChildItem -LiteralPath artifacts/release -Force)
          if (@($entries | Where-Object PSIsContainer).Count -gt 0) {
              throw 'Downloaded release artifact directory contains a subdirectory.'
          }
          $actual = @($entries | Select-Object -ExpandProperty Name | Sort-Object)
          if (@(Compare-Object -CaseSensitive ($expected | Sort-Object) $actual).Count -ne 0) {
              throw "Downloaded release artifact set is not exact: $($actual -join ', ')"
          }
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen
      - name: Publish exact validated package with short-lived credential
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'The validated release version is missing.' }
          if ($env:RELEASE_TAG -cne "v$version") { throw 'The validated release version does not match the release tag.' }
          $package = "artifacts/release/KeelMatrix.PackageSurface.$version.nupkg"
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
              throw "Validated package is missing: $package"
          }
          & dotnet nuget push $package --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  github-release:
    name: Create GitHub Release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/release
      - name: Create release after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_VERSION:?Validated release version is missing}"
          : "${RELEASE_TAG:?Release tag is missing}"
          : "${RELEASE_REPOSITORY:?Repository is missing}"
          if [[ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]]; then
            echo "Release tag does not match validated version: $RELEASE_TAG" >&2
            exit 1
          fi
          expected_package="KeelMatrix.PackageSurface.$RELEASE_VERSION.nupkg"
          expected_symbols="KeelMatrix.PackageSurface.$RELEASE_VERSION.snupkg"
          mapfile -t actual < <(find artifacts/release -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          if [[ "${#actual[@]}" -ne 2 || "${actual[0]}" != "$expected_package" || "${actual[1]}" != "$expected_symbols" ]]; then
            printf 'Downloaded release artifact set is not exact: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          gh release create \
            --repo "$RELEASE_REPOSITORY" \
            "$RELEASE_TAG" \
            "artifacts/release/$expected_package" \
            "artifacts/release/$expected_symbols" \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
